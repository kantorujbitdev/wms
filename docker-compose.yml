version: "3.8"

services:
  web:
    build: .
    container_name: ci3_web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql_wms
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: wms_db
      MYSQL_USER: wms
      MYSQL_PASSWORD: wms123
    ports:
      - "6606:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_wms
    restart: unless-stopped
    ports:
      - "8087:80"

    environment:
      PMA_HOST: mysql
volumes:
  mysql_data:
